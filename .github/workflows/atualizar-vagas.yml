name: Atualizar Radar Academico
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'instituicoes.json', 'revisoes.json', 'oportunidades_curadas.json', 'index.html', '.github/workflows/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-atualizacao
  cancel-in-progress: true
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependência de leitura PDF
        run: pip install pypdf==6.1.1
      - name: Testar regras de integridade
        run: python -m unittest discover -s tests -v
      - name: Testar sincronização e preservação de candidaturas
        run: node tests/test_catalogo.cjs
      - name: Buscar oportunidades
        run: python scripts/atualizar_vagas.py
      - name: Salvar atualizações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vagas.json monitoramento.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualização automática de vagas e auditoria das fontes"
            git push
          fi
  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publicar e verificar Pages existente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publicar_pages.py
